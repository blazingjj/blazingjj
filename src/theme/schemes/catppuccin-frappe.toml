# Catppuccin Frappé, by the Catppuccin org.
# https://github.com/catppuccin/catppuccin
#
# The lightest of the three dark flavours.

[palette]
fg = "#c6d0f5"                # text
bg = "#303446"                # base
black = "#51576d"             # surface1
red = "#e78284"
green = "#a6d189"
yellow = "#e5c890"
blue = "#8caaee"
magenta = "#f4b8e4"           # pink
cyan = "#81c8be"              # teal
white = "#a5adce"             # subtext0
bright-black = "#626880"      # surface2
bright-red = "#e78284"
bright-green = "#a6d189"
bright-yellow = "#e5c890"
bright-blue = "#8caaee"
bright-magenta = "#f4b8e4"
bright-cyan = "#81c8be"
bright-white = "#b5bfe2"      # subtext1

[colors]
# overlay2 at a quarter of its opacity over the background, which is
# how Catppuccin gives the selection.
highlight = { bg = "#494e63" }
# overlay2, Catppuccin's colour for comments.
hint = "#949cbb"
