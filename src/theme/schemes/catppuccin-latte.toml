# Catppuccin Latte, by the Catppuccin org.
# https://github.com/catppuccin/catppuccin
#
# The light one of the four. The greys run the other way round from the
# dark flavours: the style guide takes the dim colours from the text
# tones and the bright ones from the surfaces.

[palette]
fg = "#4c4f69"                # text
bg = "#eff1f5"                # base
black = "#5c5f77"             # subtext1
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"           # pink
cyan = "#179299"              # teal
white = "#acb0be"             # surface2
bright-black = "#6c6f85"      # subtext0
bright-red = "#d20f39"
bright-green = "#40a02b"
bright-yellow = "#df8e1d"
bright-blue = "#1e66f5"
bright-magenta = "#ea76cb"
bright-cyan = "#179299"
bright-white = "#bcc0cc"      # surface1

[colors]
# The buttons and the hints would take a surface tone, which is what
# the app is drawn on rather than something to read off it.
button = "#4c4f69"
# overlay2 at a quarter of its opacity over the background, which is
# how Catppuccin gives the selection.
highlight = { bg = "#d2d5dd" }
# overlay2, Catppuccin's colour for comments.
hint = "#7c7f93"
# Catppuccin draws a diff's header in blue, its file paths in pink and
# its hunk headers in peach. jj writes the index metadata under the same
# label as the paths, which Catppuccin would have dimmer, so the paths
# are what the label goes by.
diff-header = "blue"
diff-file-header = "magenta"
diff-hunk-header = "#fe640b"
# The changed lines, and the changed words within them, are tinted with
# the green and the red they are already written in, at the opacities
# the style guide gives. A terminal cannot lay the word's tint over the
# line's, so the word's is the two already blended.
diff-added = { bg = "#cce1cd" }
diff-added-word = { bg = "#b7d7b4" }
diff-removed = { bg = "#e9c4cf" }
diff-removed-word = { bg = "#e6a9b9" }
