# The same colours as Tokyo Night on a lighter background.

[palette]
fg = "#c0caf5"
bg = "#24283b"
black = "#1d202f"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright-black = "#414868"
bright-red = "#ff899d"
bright-green = "#9fe044"
bright-yellow = "#faba4a"
bright-blue = "#8db0ff"
bright-magenta = "#c7a9ff"
