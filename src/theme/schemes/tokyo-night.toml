# Tokyo Night, by Folke Lemaitre.
# https://github.com/folke/tokyonight.nvim
#
# The darkest of the four. The palette is the one the theme publishes for
# terminals.

[palette]
fg = "#c0caf5"
bg = "#1a1b26"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright-black = "#414868"
bright-red = "#ff899d"
bright-green = "#9fe044"
bright-yellow = "#faba4a"
bright-blue = "#8db0ff"
bright-magenta = "#c7a9ff"
bright-cyan = "#a4daff"
bright-white = "#c0caf5"

[colors]
# The selection background the theme publishes for terminals.
highlight = { bg = "#283457" }
