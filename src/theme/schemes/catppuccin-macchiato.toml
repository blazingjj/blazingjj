# Catppuccin Macchiato, by the Catppuccin org.
# https://github.com/catppuccin/catppuccin
#
# The same sixteen as Catppuccin Mocha, a shade lighter throughout.

[palette]
fg = "#cad3f5"                # text
bg = "#24273a"                # base
black = "#494d64"             # surface1
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"           # pink
cyan = "#8bd5ca"              # teal
white = "#a5adcb"             # subtext0
bright-black = "#5b6078"      # surface2
bright-red = "#ed8796"
bright-green = "#a6da95"
bright-yellow = "#eed49f"
bright-blue = "#8aadf4"
bright-magenta = "#f5bde6"
bright-cyan = "#8bd5ca"
bright-white = "#b8c0e0"      # subtext1

[colors]
# overlay2 at a quarter of its opacity over the background, which is
# how Catppuccin gives the selection.
highlight = { bg = "#404459" }
# overlay2, Catppuccin's colour for comments.
hint = "#939ab7"
