[package]
name = "blazingjj"
description = "TUI for Jujutsu/jj"
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/blazingjj/blazingjj"
authors = ["Charles Crete <charles@cretezy.com>"]
rust-version = "1.88.0"

[package.metadata.binstall]
# `cargo binstall` gets confused by the `v` before versions in archive name.
pkg-url = "{ repo }/releases/download/v{ version }/blazingjj-v{ version }-{ target }.{ archive-format }"


[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["osc52"] }
insta = { version = "1.48.0", features = ["filters"] }
itertools = "0.15.0"
ratatui = { version = "0.30.2", features = [
  "serde",
  "unstable-rendered-line-info",
] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.22.0"
serde_json = "1.0.151"
shell-words = "1.1.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
throbber-widgets-tui = "0.11.1"
toml = "1.1.4"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-chrome = "0.7.2"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
ratatui-textarea = "0.9.2"
version-compare = "0.2.1"

# Release build optimize size.
# Run strip manually after build to reduce further.
[profile.release]
lto = true
opt-level = 's'     # Optimize for size.
codegen-units = 1
strip = "symbols"
