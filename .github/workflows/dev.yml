name: Dev preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: read-all

# Runs of the same preview race each other for the tag, and only the newest
# one is worth having anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  preview-release:
    permissions:
      contents: write
    uses: ./.github/workflows/preview-release.yml
    with:
      tag: dev-preview
      title: Dev preview
